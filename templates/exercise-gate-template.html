<!-- prettier-ignore -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#e0162b">
    <meta name="keywords" content="{{KEYWORDS}}">
    <meta name="description" content="{{DESCRIPTION}}">
    <meta name="generator" content="English Grammar - intermediate levels A2 and above">
    <link href="{{CANONICAL}}" rel="non-canonical">
    <title>{{PAGE_TITLE}}</title>
    <!-- Asset paths intentionally use ../ from exercise directories; keep in sync with generator outputs -->
    <link href="../favicon.ico" rel="shortcut icon" type="image/vnd.microsoft.icon">
    <style id="theme-vars-critical">
      :root {
        --primary-color: #e0162b;
        --secondary-color: #f5f8ff;
        --tertiary-color: #002786;
        --text-color: #212121;
        --background-color: #798ea4;
        --footer-background: #3e4b5b;
        --icon-color-on-dk: #f5f8ff;
        --icon-color-on-lt: #8a94a8;
        --pager-background: var(--surface-color, #fff);
        --pager-border-color: var(--border-color, #d0d6e4);
        --pager-border-radius: 3px;
        --pager-font-size: clamp(0.9rem, 0.85rem + 0.2vw, 1.05rem);
        --pager-font-weight: 500;
        --pager-gap-x: 14px;
        --pager-gap-y: 10px;
        --pager-hover-shadow: 0 0 0 3px rgb(224 22 43 / 15%);
        --pager-icon-size: 1.25rem;
        --pager-label-truncate: ellipsis;
        --pager-label-wrap: nowrap;
        --pager-link-shadow: inset 0 0 0 1px rgb(255 255 255 / 35%);
        --pager-padding-block: 0.6rem;
        --pager-padding-inline: 0.95rem;
        --pager-text-color: var(--text-color, #212121);
        --menu-icon-pad-inline: 6px;
        --left-menu-font-size: clamp(0.86rem, calc(0.72rem + 0.45vw), 0.96rem);
        --left-menu-icon-size: clamp(1.25rem, calc(var(--left-menu-font-size) * 1.2), 1.45rem);
        --left-menu-icon-slot: calc(var(--left-menu-icon-size) * 1.32);
        --left-menu-icon-gap: calc(var(--left-menu-font-size) * 0.6);
        --flyout-toggle-size: max(var(--left-menu-icon-size), 24px);
        --r-flyout-bg: var(--menu-link-bg, var(--surface-color, #fff));
        --r-flyout-border: var(--border-color, #d0d6e4);
        --r-flyout-divider: var(--divider-color, #d0d6e4);
        --r-flyout-highlight: var(--surface-warm, #fff);
        --r-flyout-shadow-menu: var(--flyout-shadow-menu, 0 12px 26px rgb(24 39 75 / 8%));
        --r-flyout-shadow-panel: var(--flyout-shadow-panel, 0 18px 32px rgb(24 39 75 / 12%));
        --r-flyout-transition: 160ms cubic-bezier(0.4, 0, 0.2, 1);
      }

      body.base,
      body.site {
        border-top: 15px solid var(--footer-background);
        padding: 20px;
        background-color: var(--background-color);
      }

      img[src*="../images/banner.png"] {
        height: 120;
        width: 650;
      }

      img[src*="../favicon.png"] {
        height: 24px;
        max-height: 28px;
        width: 24px;
      }

      img[src*="../web-asset/icons/svg/sized/plus3.svg"],
      img[src*="../web-asset/icons/svg/sized/minus5.svg"] {
        height: var(--flyout-toggle-size);
        max-height: var(--flyout-toggle-size);
        width: var(--flyout-toggle-size);
      }

      img[src*="../web-asset/icons/svg/sized/angle-left.svg"] {
        height: 24px;
        max-height: 28px;
      }

      img[src*="../web-asset/icons/svg/sized/angle-right.svg"] {
        height: 24px;
        max-height: 28px;
      }
    </style>
    <link
      rel="preload"
      href="../web-asset/css/base.css"
      as="style"
      onload="
        this.onload = null
        this.rel = 'stylesheet'
      ">
    <link rel="stylesheet" href="../web-asset/css/base.css" media="print" onload="this.media = 'all'">
    <noscript>
      <link rel="stylesheet" href="../web-asset/css/base.css">
    </noscript>
    <link rel="preload" href="../web-asset/css/exercises.css" as="style">
    <link rel="stylesheet" href="../web-asset/css/exercises.css" media="print" onload="this.media = 'all'">
    <noscript>
      <link rel="stylesheet" href="../web-asset/css/exercises.css">
    </noscript>
    <link rel="preload" href="../web-asset/css/right-rail-flyout.css" as="style">
    <link rel="stylesheet" href="../web-asset/css/right-rail-flyout.css" media="print" onload="this.media = 'all'">
    <noscript>
      <link rel="stylesheet" href="../web-asset/css/right-rail-flyout.css">
    </noscript>
    <link rel="preload" href="../web-asset/css/left-menu.css" as="style">
    <link rel="stylesheet" href="../web-asset/css/left-menu.css" media="print" onload="this.media = 'all'">
    <noscript>
      <link rel="stylesheet" href="../web-asset/css/left-menu.css">
    </noscript>
    <link rel="preload" href="../web-asset/css/page-classes.css" as="style">
    <link rel="stylesheet" href="../web-asset/css/page-classes.css" media="print" onload="this.media = 'all'">
    <noscript>
      <link rel="stylesheet" href="../web-asset/css/page-classes.css">
    </noscript>
    <link rel="preload" href="../web-asset/css/exercise-1-nouns_new.css" as="style">
    <link rel="stylesheet" href="../web-asset/css/exercise-1-nouns_new.css" media="print" onload="this.media = 'all'">
    <noscript>
      <link rel="stylesheet" href="../web-asset/css/exercise-1-nouns_new.css">
    </noscript>
    <link rel="stylesheet" href="../web-asset/css/qa-accordion.css">
    <noscript>
      <style>
        #content .accordion-body {
          height: auto !important;
          max-height: none !important;
          overflow: visible !important;
        }
      </style>
    </noscript>
    <script type="module" src="../web-asset/js/main.bundle.js"></script>

    <script src="../web-asset/js/right-rail-flyout.js" defer></script>
    <script src="../web-asset/js/exercise-gate.js" defer></script>
  </head>

  <body class="base exercize">
    <svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" aria-hidden="true" style="position: absolute; width: 0; height: 0; overflow: hidden">
      <defs>
        <symbol id="icon-plus" viewBox="0 0 24 24">
          <path fill="currentColor" d="M12 5a1 1 0 0 0-1 1v5H6a1 1 0 1 0 0 2h5v5a1 1 0 1 0 2 0v-5h5a1 1 0 1 0 0-2h-5V6a1 1 0 0 0-1-1z"></path>
        </symbol>
        <symbol id="icon-minus" viewBox="0 0 24 24">
          <rect x="9" y="11" width="6" height="2" rx="1" fill="currentColor"></rect>
        </symbol>
      </defs>
    </svg>
    <div class="body grid-modern" id="top">
      <div class="container">
        <div class="row-fluid padme1">
          <div class="row-fluid">
            <main id="content" class="span8">
              <div class="item-page" itemscope itemtype="https://schema.org/Article">
                <meta itemprop="inLanguage" content="en-GB">
                <div class="page-header">
                  <h2 itemprop="headline">{{ARTICLE_HEADING}}</h2>
                </div>
                <div itemprop="articleBody">
                  {{PAGER_HTML}} {{INTRO_HTML}}
                  <form class="exercise-form exercise-gate" data-exercise-form data-storage-key="{{STORAGE_KEY}}" novalidate>
                    <fieldset class="exercise-form__intro">
                      <legend class="visually-hidden">Exercise setup</legend>
                      <div class="exercise-form__intro-layout">
                        <div class="exercise-form__intro-fields">
                          <div class="exercise-form__email">
                            <input class="exercise-form__email-input" type="email" id="exercise-email" name="exerciseEmail" autocomplete="email" required data-exercise-email placeholder="name@example.com">
                          </div>
                          <div class="exercise-form__student-id">
                            <input
                              class="exercise-form__email-input exercise-form__student-id-input"
                              type="text"
                              id="exercise-student-id"
                              name="exerciseStudentId"
                              inputmode="text"
                              autocomplete="off"
                              autocapitalize="none"
                              spellcheck="false"
                              required
                              pattern="^[a-z]+\d{3}$"
                              data-exercise-student-id
                              placeholder="Eagles user ID - e.g., tammy001"
                              aria-describedby="exercise-student-id-note">
                          </div>
                        </div>
                        <p class="exercise-form__progress tm01" data-exercise-progress="" aria-live="polite">0 of {{TOTAL_QUESTIONS}} questions completed.</p>
                        <span class="exercise-form__last-attempt" data-exercise-last-attempt="" hidden aria-live="polite"></span>
                        <div class="exercise-form__feedback" data-exercise-feedback="" aria-live="polite"></div>
                      </div>
                    </fieldset>
                    {{QUESTION_BLOCKS}}
                    <div class="exercise-submit-row" data-exercise-submit-row="" hidden>
                      <button type="submit" class="exercise-submit-button" data-exercise-submit="" disabled>Submit answers</button>
                      <div id="exercise-status" class="status-warn" aria-live="polite"></div>
                    </div>
                  </form>
                  <script type="application/json" id="exercise-answer-key" data-exercise-answer-key>
                    {{ANSWER_KEY_JSON}}
                  </script>
                  <script type="application/json" id="exercise-config" data-exercise-config>
                    {{CONFIG_JSON}}
                  </script>
                  <script>
                    ;(() => {
                      const cfgEl = document.querySelector("#exercise-config[data-exercise-config]")
                      if (!cfgEl) return
                      const cfg = JSON.parse(cfgEl.textContent || "{}")
                      if (!cfg.submitUrl) {
                        const host = location.host
                        if (host === "127.0.0.1:5500" || host === "localhost:5500") {
                          cfg.submitUrl = "http://127.0.0.1:8787/api/exercise-submission"
                        } else {
                          cfg.submitUrl = "https://thuvien.eagles.edu.vn/api/exercise-submission"
                        }
                        cfgEl.textContent = JSON.stringify(cfg)
                      }
                    })()
                  </script>
                  {{PAGER_HTML}}
                </div>
              </div>
            </main>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
