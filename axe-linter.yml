# axe Accessibility Linter configuration
# Updated: 2025-09-17 (Asia/Bangkok)

# BEGIN CHANGE: Replaced prior `axeOptions.runOnly.tags` with top-level `tags`
# RATIONALE: axe-linter reads `tags` at the top level; `axeOptions` is not supported here.
tags:
  - wcag21a
  - wcag21aa
# END CHANGE

# BEGIN CHANGE: Rules must be booleans only; severities ("warn"/"error") and objects are not supported
# RATIONALE: The error "Rule value should only be a boolean" was triggered by non-boolean values.
rules:
  empty-table-header: false # (kept) disable this rule
  color-contrast: true # CHANGED: was 'warn' -> true (on/off only)
  label: true # CHANGED: was 'error' -> true
  region: true # CHANGED: was 'warn' -> true
  landmark-one-main: true # CHANGED: was object/options -> true
# END CHANGE

# NOTE: Removed unsupported sections from the previous file:
# - axeOptions (runOnly/resultTypes/checks/options) — not used by axe-linter config
# - overrides with per-rule changes — not supported; use per-folder axe-linter.yml instead
# - notifications (onSave/problemsView) — not part of axe-linter config schema
