          - heading "Nouns with same singular and plural forms and also takes a plural ending (-s)." [level=3] [ref=e39]
          - paragraph [ref=e40]: "A small group of English nouns keep the same spelling whether you are talking about one item or many. ESL learners can match these nouns with numerals, determiners, or verb forms-the words around the noun tell the number even when the noun itself does not change. Examples: \"a series of lectures,\" \"two series of lectures,\" \"the police are,\" and \"a police officer is.\" Counting words or context clues will always guide you when the noun does not wear an extra \"s.\""
