        - heading "List of Absolute Adjectives" [level=3] [ref=e23]
        - paragraph [ref=e24]:
          - strong [ref=e25]: Some adjectives express ideas that cannot be graded
          - text: . For example, a person can’t be
          - strong [ref=e26]: more or less dead
          - text: . In the same way, a sphere can’t be
          - strong [ref=e27]: more or less round
          - text: . In grammars these adjectives are
          - strong [ref=e28]: called non-gradable
          - text: or
          - strong [ref=e29]: absolute adjectives.
        - paragraph [ref=e30]:
          - strong [ref=e31]: Non-gradable adjectives do not have comparative or superlative forms
          - text: .
          - emphasis [ref=e32]: There are very few non-gradable adjectives
          - text: ", so you can learn them by heart if you really want. Here is a list of common non-gradable adjectives in English. Note that this is not a comprehensive list."
        - generic [ref=e33]:
          - heading "Examples:" [level=4] [ref=e34]
          - paragraph [ref=e35]:
            - emphasis [ref=e36]: Absolute, impossible, principal, adequate, inevitable, sufficient, complete, main, unanimous, unavoidable, entire, minor, fatal, unique, final, universal, ideal, whole, preferable, dead etc.
        - heading "Exceptions" [level=3] [ref=e37]
        - paragraph [ref=e38]:
          - text: Although the adjectives given above are not normally used in comparative and superlative forms, you might still hear expressions like
          - strong [ref=e39]: more complete
          - text: or
          - strong [ref=e40]: most perfect
          - text: . Though incorrect, these expressions are quite common in speech and they have become sort of acceptable, too. However, if you are a careful user of the language, you must avoid them especially in writing.
        - paragraph [ref=e41]:
          - text: Also be careful, not to use
          - strong [ref=e42]: more
          - text: along with a comparative adjective ending in
          - strong [ref=e43]: –er
          - text: and
          - strong [ref=e44]: most
          - text: with a superlative adjective ending in
          - strong [ref=e45]: "-est"
          - text: . Do not write
          - strong [ref=e46]: more taller
          - text: or
          - strong [ref=e47]: most smartest.
          - text: These are examples of double comparatives and superlatives. They are always wrong and must be avoided.
        - generic [ref=e48]:
          - heading "Examples:" [level=4] [ref=e49]
          - list [ref=e50]:
            - listitem [ref=e51]:
              - text: ★ She is
              - strong [ref=e52]: prettier than
              - text: her sister. (NOT She is
              - strong [ref=e53]: more prettier than
              - text: her sister.)
        - paragraph [ref=e54]: Some compound adjectives have two possible comparatives and superlatives.
        - generic [ref=e55]:
          - heading "Examples:" [level=4] [ref=e56]
          - list [ref=e57]:
            - listitem [ref=e58]:
              - text: "★ Positive: g"
              - emphasis [ref=e59]: ood-looking
            - listitem [ref=e60]:
              - text: "★ Comparative: b"
              - emphasis [ref=e61]: etter-looking
              - text: or
              - emphasis [ref=e62]: more good-looking
            - listitem [ref=e63]:
              - text: "★ Superlative: b"
              - emphasis [ref=e64]: est-looking
              - text: or
              - emphasis [ref=e65]: most good-looking
            - listitem [ref=e66]:
              - text: "★ Positive: w"
              - emphasis [ref=e67]: ell-known
            - listitem [ref=e68]:
              - text: "★ Comparative: b"
              - emphasis [ref=e69]: etter-known
              - text: or
              - emphasis [ref=e70]: more well-known
            - listitem [ref=e71]:
              - text: "★ Superlative:"
              - emphasis [ref=e72]: best-known
              - text: or
              - emphasis [ref=e73]: most well-known
        - paragraph [ref=e74]:
          - text: In this case, you can decide which form you want to use, but don’t write
          - strong [ref=e75]: most best-known
          - text: or
          - strong [ref=e76]: more better-looking.
