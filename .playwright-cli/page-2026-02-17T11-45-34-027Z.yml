          - heading "Linking Verbs" [level=3] [ref=e45]
          - paragraph [ref=e46]:
            - strong [ref=e47]: Linking verbs are not used to show actions. They act as a link between the subject and the complement, which describes the subject .
            - emphasis [ref=e48]: The complement is mostly an adjective or an adjective phrase
            - text: although it can be a noun phrase or an adverbial. The complement gives more information about the subject.
          - paragraph [ref=e49]:
            - strong [ref=e50]: "Verbs that are always linking verbs:"
          - table [ref=e51]:
