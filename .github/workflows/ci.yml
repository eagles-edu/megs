name: CI
permissions:
  contents: read
  pull-requests: write

on:
  push:
    branches: [ trunk-revert ]
  pull_request:
    branches: [ trunk-revert ]

jobs:
  ci:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint (JS/CSS/HTML)
        run: npm run lint

      - name: Verify Prototype (QA/menus)
        run: npm run verify:prototype

      - name: Smoke Test Multiple Pages
        run: npm run smoke:pages
