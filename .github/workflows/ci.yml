name: CI
permissions:
  contents: read
  pull-requests: write

on:
  push:
    branches: [ trunk ]
  pull_request:
    branches: [ trunk ]

jobs:
  ci:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint (JS/CSS/HTML)
        run: npm run lint

      - name: Verify Prototype (QA/menus)
        run: npm run verify:prototype

      - name: Smoke Test Multiple Pages
        run: npm run smoke:pages

      # (optional) upload to Codacy service (kept here if you want separate from SARIF)
      - name: Codacy Analysis (upload to Codacy)
        if: ${{ env.CODACY_PROJECT_TOKEN != '' }}
        uses: codacy/codacy-analysis-cli-action@v4
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          tool: eslint
          upload: true
          verbose: true

      - name: Skip Codacy Analysis (token missing)
        if: ${{ env.CODACY_PROJECT_TOKEN == '' }}
        run: echo "Skipping Codacy analysis because CODACY_PROJECT_TOKEN is not set."
