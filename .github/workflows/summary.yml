name: Summarize new issues

on:
  issues:
    types: [opened]  # triggers when a new issue is opened

# Explicit minimal permissions for the auto GITHUB_TOKEN (your PAT scopes are separate)
permissions:
  contents: read
  issues: write
  models: read
  actions: read

concurrency:
  group: summarize-issue-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  summary:
    runs-on: ubuntu-22.04
    environment: megs_env   # use env-scoped secrets like PERSONAL_ACCESS_TOKEN_GITHUB

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install jq (robustness)
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      # CHG: Resolve workflow IDs robustly (yml/yaml, alternate names), then fetch the latest run.
      - name: Gather latest workflow results (ci/codacy/codeql)
        id: wf
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN_GITHUB }}   # use your PAT; not GITHUB_*
        run: |
          set -euo pipefail

          repo="${GITHUB_REPOSITORY}"
          tmp="$(mktemp)"
          echo "### Latest workflow runs" > "$tmp"

          # helper emoji
          emoji() {
            case "${1:-}" in
              success) echo "✅" ;;
              failure) echo "❌" ;;
              canceled|timed_out|stale) echo "⚠️" ;;
              in_progress|queued|waiting|pending|requested) echo "⏳" ;;
              *) echo "❔" ;;
            esac
          }

          # Try to list all workflows once; if this fails, it's almost certainly token scope
          list_json="$(gh api -H "Accept: application/vnd.github+json" \
            "/repos/${repo}/actions/workflows?per_page=100" \
            --silent --show-error 2>/dev/null || true)"

          if [ -z "${list_json}" ] || [ "${list_json}" = "null" ]; then
            {
              echo "- **ci.yml**: ❔ Workflow not found or no access."
              echo "- **codacy-analysis.yml**: ❔ Workflow not found or no access."
              echo "- **codeql.yml**: ❔ Workflow not found or no access."
              echo
              echo "_Hint: fine-grained PAT must allow this repo and grant **Actions: Read**; classic PAT needs **repo**._"
            } >> "$tmp"
          else
            # Build a table of (id, base filename lowercased)
            mapfile -t WF_TABLE < <(printf '%s\n' "${list_json}" | jq -r '.workflows[] | "\(.id)\t\(.path | split("/")[-1] | ascii_downcase)"')

            find_id() {
              # args: preferred basename (stem), optional alt stem
              local stem="${1}" alt="${2:-}"
              local cands=( "${stem}.yml" "${stem}.yaml" )
              if [ -n "${alt}" ]; then
                cands+=( "${alt}.yml" "${alt}.yaml" )
              fi
              local id=""
              for row in "${WF_TABLE[@]}"; do
                local wid="${row%%$'\t'*}"
                local base="${row#*$'\t'}"
                for cand in "${cands[@]}"; do
                  if [ "${base}" = "${cand}" ]; then
                    id="${wid}"; break 2
                  fi
                done
              done
              printf '%s' "${id}"
            }

            # Resolve IDs for the three logical workflows
            ci_id="$(find_id "ci")"
            codacy_id="$(find_id "codacy-analysis" "codacy_analysis")"
            codeql_id="$(find_id "codeql" "codeql-analysis")"

            # Query latest run by numeric ID when available; else print helpful message
            fetch_latest() {
              local label="$1" wid="$2"
              if [ -z "${wid}" ]; then
                echo "- **${label}**: ❔ Workflow not found in this repository (check filename .yml/.yaml or path)." >> "$tmp"
                return
              fi
              local runs_json
              runs_json="$(gh api -H "Accept: application/vnd.github+json" \
                "/repos/${repo}/actions/workflows/${wid}/runs?per_page=1" \
                --silent --show-error 2>/dev/null || true)"
              if [ -z "${runs_json}" ] || [ "${runs_json}" = "null" ]; then
                echo "- **${label}**: ❔ No runs found or no access." >> "$tmp"
                return
              fi
              local run_id status conclusion url run_number updated
              run_id="$(printf '%s\n' "${runs_json}" | jq -r '.workflow_runs[0].id // empty')"
              status="$(printf '%s\n' "${runs_json}" | jq -r '.workflow_runs[0].status // ""')"
              conclusion="$(printf '%s\n' "${runs_json}" | jq -r '.workflow_runs[0].conclusion // ""')"
              url="$(printf '%s\n' "${runs_json}" | jq -r '.workflow_runs[0].html_url // ""')"
              run_number="$(printf '%s\n' "${runs_json}" | jq -r '.workflow_runs[0].run_number // ""')"
              updated="$(printf '%s\n' "${runs_json}" | jq -r '.workflow_runs[0].updated_at // ""')"
              local em; em="$(emoji "${conclusion:-$status}")"
              echo "- **${label}**: ${em} ${conclusion:-$status} — run #${run_number} at ${updated} — ${url}" >> "$tmp"

              # Jobs for this run
              if [ -n "${run_id}" ]; then
                local jobs_json
                jobs_json="$(gh api -H "Accept: application/vnd.github+json" \
                  "/repos/${repo}/actions/runs/${run_id}/jobs?per_page=100" \
                  --silent --show-error 2>/dev/null || true)"
                if [ -n "${jobs_json}" ] && [ "${jobs_json}" != "null" ]; then
                  printf '%s\n' "${jobs_json}" \
                    | jq -r '.jobs[] | "  • \(.name): \((.conclusion // .status) // "unknown")"' >> "$tmp"
                fi
              fi
            }

            fetch_latest "ci.yml" "${ci_id}"
            fetch_latest "codacy-analysis.yml" "${codacy_id}"
            fetch_latest "codeql.yml" "${codeql_id}"
          fi

          # Output for later steps (safe, unique delimiter)
          delim="WF_SUMMARY_$(date +%s%N)"
          {
            printf 'workflow_summary<<%s\n' "$delim"
            cat "$tmp"
            printf '%s\n' "$delim"
          } >> "$GITHUB_OUTPUT"

      - name: Run AI inference
        id: inference
        uses: actions/ai-inference@v1
        with:
          model: openai/gpt-4o-mini
          prompt: |
            ROLE
            You are a cautious senior (15+ yrs) software engineering assistant. Produce an actionable, COMPLETE CI digest using ONLY the inputs below (Issue Title/Body + Workflow Context). Do NOT invent data.

            GOAL
            Create a GitHub-Markdown comment that:
            1) Reports per-workflow status for EXACTLY these three workflows:
               - ci.yml
               - codacy-analysis.yml
               - codeql.yml
            2) Enumerates every relevant error/warning/finding present in the Issue Body.
            3) Groups identical messages with counts and file:line occurrences.
            4) Proposes concrete next steps.

            INPUTS
            - Title: ${{ github.event.issue.title }}
            - Body:  ${{ github.event.issue.body || '(No body provided.)' }}
            - URL:   ${{ github.event.issue.html_url }}

            WORKFLOW CONTEXT (from GitHub API; latest run per file)
            ${{ steps.wf.outputs.workflow_summary }}

            STRICT RULES
            - Treat the WORKFLOW CONTEXT as authoritative for run status and job outcomes.
            - If Body lacks logs for a workflow, still report its status from the context.
            - NO artificial length limits: list ALL findings. For very long lists, group duplicates with counts and put full expansions inside <details> blocks.
            - Prefer structured data: severity, rule/CVE ID, file:line, package@version, exit codes, counts.
            - Never summarize away specifics that are present.

            OUTPUT FORMAT
            ## CI Digest — ${{ github.event.issue.title }}

            **Action Checklist**
            - [ ] Highest-impact fix first (one sentence + command/path if clear)
            - [ ] Provide missing artifacts/logs for any unclear items

            ### Workflows
            - **ci.yml:** STATUS (✅/❌/⚠️/⏳/❔) — one-sentence outcome.
              **Jobs:** (from context) list each job and its status.
              **Findings from Body (grouped):**
              - Message A (N occurrences)
                - path/to/file1:line
                - path/to/file2:line
              <details><summary>All ci.yml findings (expanded)</summary>

              ```text
              # Full list of ALL findings for ci.yml if present in Body
              ```
              </details>
              **Next steps:** concrete actions.

            - **codacy-analysis.yml:** STATUS — one-sentence outcome.
              **Jobs:** (from context) …
              **Findings from Body (grouped):** CVEs/rules with counts & locations
              <details><summary>All Codacy/Trivy findings (expanded)</summary>

              ```text
              # Full list if present in Body
              ```
              </details>
              **Next steps:** …

            - **codeql.yml:** STATUS — one-sentence outcome.
              **Jobs:** (from context) …
              **Findings from Body (grouped):** rule IDs, locations, summaries
              <details><summary>All CodeQL findings (expanded)</summary>

              ```text
              # Full list if present in Body
              ```
              </details>
              **Next steps:** …

            ### Notable Errors (top 3 by severity/impact if present)
            > Quote 1–2 most informative lines per item (trimmed).

            ### If Body is empty
            If Body equals “(No body provided.)”, output:
            - One brief sentence inferring topic from the Title.
            - A 4-bullet polite request for:
              1) steps to reproduce
              2) expected vs. actual
              3) environment (OS, versions, logs/links)
              4) minimal repro (link or code)

      - name: Terminal report (always)
        if: always()
        env:
          WORKFLOW_SUMMARY: ${{ steps.wf.outputs.workflow_summary }}
          RESPONSE_FILE: ${{ steps.inference.outputs['response-file'] }}
          RESPONSE: ${{ steps.inference.outputs.response }}
        run: |
          set -euo pipefail
          echo "============================================================"
          echo " Summarize New Issues — Terminal Report"
          echo "============================================================"
          echo
          echo "WORKFLOW CONTEXT"
          echo "------------------------------------------------------------"
          if [ -n "${WORKFLOW_SUMMARY:-}" ]; then
            printf '%s\n' "${WORKFLOW_SUMMARY}"
          else
            echo "(no workflow context available)"
          fi
          echo
          echo "AI SUMMARY (raw)"
          echo "------------------------------------------------------------"
          if [ -n "${RESPONSE_FILE:-}" ] && [ -s "${RESPONSE_FILE}" ]; then
            cat "${RESPONSE_FILE}" || true
          elif [ -n "${RESPONSE:-}" ]; then
            printf '%s\n' "${RESPONSE}"
          else
            echo "(AI returned no content)"
          fi
          echo "============================================================"

      - name: Comment with AI summary
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN_GITHUB }}  # use your PAT
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RESPONSE_FILE: ${{ steps.inference.outputs['response-file'] }}
          RESPONSE: ${{ steps.inference.outputs.response }}
        run: |
          set -euo pipefail
          if [ -z "${ISSUE_NUMBER:-}" ]; then
            echo "No issue number available; skipping comment."
            exit 0
          fi

          body_file="$(mktemp)"
          if [ -n "${RESPONSE_FILE:-}" ] && [ -s "${RESPONSE_FILE}" ]; then
            cp "${RESPONSE_FILE}" "${body_file}"
          else
            printf '%s' "${RESPONSE:-"(AI returned no content)"}" > "${body_file}"
          fi

          gh issue comment "${ISSUE_NUMBER}" --body-file "${body_file}"
