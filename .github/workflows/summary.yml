name: Summarize new issues

on:
  issues:
    types: [opened]

jobs:
  summary:
    runs-on: ubuntu-22.04
    permissions:
      issues: write
      models: read
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run AI inference
        id: inference
        uses: actions/ai-inference@v1
        with:
          model: gpt-4.1-mini
          input: |
            [
              {
                "role": "user",
                "content": "Summarize the following GitHub issue in one paragraph:\nTitle: ${{ github.event.issue.title }}\nBody: ${{ github.event.issue.body }}"
              }
            ]

      - name: Comment with AI summary
        uses: actions/github-script@v7
        env:
          AI_SUMMARY: ${{ steps.inference.outputs.response }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const body = process.env.AI_SUMMARY;
            if (!body) {
              core.setFailed('No AI summary was generated.');
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });