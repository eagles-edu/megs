name: Codacy Analysis (ESLint + Trivy)

on:
  push:
    branches: [ trunk ]
  pull_request:
    branches: [ trunk ]
  workflow_dispatch:

concurrency:
  group: codacy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  actions: read
  pull-requests: write

jobs:
  codacy-analysis:
    name: Codacy Analysis
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      ESLINT_USE_FLAT_CONFIG: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node (from .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install deps
        run: npm ci

      # ───────────── ESLint (native, flat) → SARIF ─────────────
      - name: ESLint → SARIF
        run: |
          npx eslint . \
            -f @microsoft/eslint-formatter-sarif \
            -o results-eslint.sarif || true

      - name: Validate ESLint SARIF
        id: validate_eslint
        run: |
          node -e "const fs=require('fs');let ok=false;
          try{const s=fs.readFileSync('results-eslint.sarif','utf8'); if(s.trim().length>2){const j=JSON.parse(s); ok=Array.isArray(j.runs)&&j.runs.length>0;}}catch(e){}
          console.log('eslint_sarif_ok='+ok);
          require('fs').appendFileSync(process.env.GITHUB_OUTPUT, `ok=${ok}\n`);"

      - name: Upload ESLint SARIF to GitHub
        uses: github/codeql-action/upload-sarif@v3
        if: steps.validate_eslint.outputs.ok == 'true'
        with:
          sarif_file: results-eslint.sarif
          wait-for-processing: true

      # ───────────── Trivy via Codacy CLI → SARIF ─────────────
      # Generates SARIF for GitHub; uploads to Codacy only if token is present.
      - name: Codacy CLI (Trivy → SARIF)
        uses: codacy/codacy-analysis-cli-action@v4
        with:
          tool: trivy
          directory: .
          run-docker-tools: true
          allow-network: true
          format: sarif
          output: results-trivy.sarif
          gh-code-scanning-compat: true
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          upload: ${{ secrets.CODACY_PROJECT_TOKEN != '' }}
          fail-if-incomplete: true
          # skip-container-engine-check: true  # uncomment if the runner blocks Docker

      - name: Validate Trivy SARIF
        id: validate_trivy
        run: |
          node -e "const fs=require('fs');let ok=false;
          try{const s=fs.readFileSync('results-trivy.sarif','utf8'); if(s.trim().length>2){const j=JSON.parse(s); ok=Array.isArray(j.runs)&&j.runs.length>0;}}catch(e){}
          console.log('trivy_sarif_ok='+ok);
          require('fs').appendFileSync(process.env.GITHUB_OUTPUT, `ok=${ok}\n`);"

      - name: Upload Trivy SARIF to GitHub
        uses: github/codeql-action/upload-sarif@v3
        if: steps.validate_trivy.outputs.ok == 'true'
        with:
          sarif_file: results-trivy.sarif
          wait-for-processing: true
