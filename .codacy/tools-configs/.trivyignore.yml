# .trivyignore.yaml file in your project root:

# Ignore specific vulnerabilities
vulnerabilities:
  # Ignore by CVE ID
  - id: 'CVE-2021-12345'
    paths:
      - 'package.json'
    reason: 'False positive - not applicable to our use case'
    expires: '2024-12-31'

  # Ignore by package
  - id: 'CVE-2021-67890'
    paths:
      - '**/node_modules/lodash/**'
    reason: 'Waiting for upstream fix'

# Ignore misconfigurations
misconfigurations:
  - id: 'DS002'
    paths:
      - 'Dockerfile'
    reason: 'Intentional design decision'

  - id: 'KSV001'
    paths:
      - 'k8s/development/**'
    reason: 'Development environment only'

# Ignore secrets
secrets:
  - id: 'generic-api-key'
    paths:
      - 'examples/**'
    reason: 'Example/demo data only'

  - id: 'aws-access-key-id'
    paths:
      - 'docs/setup.md'
    reason: 'Documentation example'